    function previewPhoto(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = function (ev) {
        const img = document.getElementById('photoPreview');
        img.src = ev.target.result;
        img.style.display = 'block';
      };

      reader.readAsDataURL(file);
    }

    async function loadEditData(id) {
      try {
        const d = await mediConnect.getDonationById(id);

        if (!d) {
          showToast('No se encontró la donación', 'error');
          setTimeout(function () {
            location.href = 'dashboard.html';
          }, 1500);
          return;
        }

        const user = mediConnect.getUser();

        if (!user || d.donante_id !== user.id) {
          location.href = 'dashboard.html';
          return;
        }

        document.getElementById('medCodigo').value = d.codigo_barras || '';
        document.getElementById('medNombre').value = d.nombre || '';
        document.getElementById('medTipo').value = d.tipo || 'Otro';
        document.getElementById('medCantidad').value = d.cantidad || 1;
        document.getElementById('medFecha').value = d.fecha_vencimiento || '';

        if (d.imagen_url) {
          const img = document.getElementById('photoPreview');
          img.src = d.imagen_url;
          img.style.display = 'block';
          existingImageUrl = d.imagen_url;
        }

        if (d.lat && d.lng) {
          const lat = parseFloat(d.lat);
          const lng = parseFloat(d.lng);

          document.getElementById('medLat').value = lat;
          document.getElementById('medLng').value = lng;

          const checkMap = setInterval(function () {
            if (typeof donarMap !== 'undefined' && donarMap !== null) {
              const loc = { lat: lat, lng: lng };

              donarMap.setCenter(loc);
              donarMap.setZoom(16);

              if (typeof placeMarkerAndValidate === 'function') {
                placeMarkerAndValidate(loc, donarMap, true);
              }

              clearInterval(checkMap);
            }
          }, 200);

          setTimeout(function () {
            clearInterval(checkMap);
          }, 5000);
        }

      } catch (e) {
        console.error(e);
        showToast('Error al cargar la donación', 'error');
      }
    }

    async function submitDonation() {
      const user = mediConnect.getUser();

      if (!user) {
        location.href = 'index.html';
        return;
      }

      const codigo = document.getElementById('medCodigo').value.trim();
      const nombre = document.getElementById('medNombre').value.trim();
      const tipo = document.getElementById('medTipo').value;
      const cant = parseInt(document.getElementById('medCantidad').value, 10);
      const fecha = document.getElementById('medFecha').value;
      const lat = document.getElementById('medLat').value;
      const lng = document.getElementById('medLng').value;

      if (!nombre) {
        showToast('Ingresa el nombre del medicamento', 'error');
        return;
      }

      if (!fecha) {
        showToast('Por favor, ingresa la fecha de vencimiento', 'error');
        return;
      }

      if (!lat || !lng) {
        showToast('Por favor, selecciona la ubicación en el mapa', 'error');
        return;
      }

      if (!cant || cant < 1) {
        showToast('La cantidad debe ser al menos 1', 'error');
        return;
      }

      const hoy = new Date();
      hoy.setHours(0, 0, 0, 0);

      const fechaVenc = new Date(fecha + 'T00:00:00');

      if (fechaVenc <= hoy) {
        showToast('La fecha de vencimiento debe ser futura', 'error');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      const donation = {
        codigo_barras: codigo,
        nombre: nombre,
        tipo: tipo,
        cantidad: cant,
        fecha_vencimiento: fecha,
        lat: parseFloat(lat),
        lng: parseFloat(lng)
      };

      if (!isEditing) {
        donation.donante_id = user.id;
        donation.estado = 'disponible';
      }

      let imagen_url = isEditing ? existingImageUrl : null;
      const fotoFile = document.getElementById('fotoInput').files[0];

      try {
        if (fotoFile) {
          imagen_url = await sb.uploadImage(fotoFile);
        }

        donation.imagen_url = imagen_url;

        let result;

        if (isEditing) {
          result = await mediConnect.updateDonation(editId, donation);
        } else {
          result = await mediConnect.addDonation(donation);
        }

        btn.disabled = false;
        btn.textContent = isEditing ? 'Guardar Cambios' : 'Registrar Donación';

        if (!result) {
          showToast('Error al procesar la solicitud', 'error');
          return;
        }

        if (isEditing) {
          showToast('¡Donación actualizada!', 'success');
          btn.textContent = '¡Cambios Guardados!';
          btn.style.background = 'var(--success)';

          setTimeout(function () {
            btn.textContent = 'Guardar Cambios';
            btn.style.background = '';
          }, 3000);

          return;
        }

        showQR(result.id || ('don-' + Math.random().toString(36).substr(2, 6)));

      } catch (error) {
        console.error(error);
        btn.disabled = false;
        btn.textContent = isEditing ? 'Guardar Cambios' : 'Registrar Donación';
        showToast('Error de conexión', 'error');
      }
    }

    function showQR(id) {
      const overlay = document.getElementById('qrOverlay');
      const container = document.getElementById('qrCode');

      container.innerHTML = '';

      document.getElementById('qrId').innerHTML =
        'ID: ' + id +
        '<br><a href="detalle.html?id=' + id + '" style="font-size:12px;color:var(--primary);text-decoration:underline;margin-top:4px;display:inline-block;">Ver detalle →</a>';

      try {
        qrInstance = new QRCode(container, {
          text: 'https://lively-salmiakki-0faf02.netlify.app/detalle.html?id=' + id,
          width: 160,
          height: 160,
          colorDark: '#1F2937',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.H
        });
      } catch (e) {
        console.error('Error generando QR:', e);
      }

      overlay.classList.add('show');
    }

    function closeQR() {
      document.getElementById('qrOverlay').classList.remove('show');

      document.getElementById('medCodigo').value = '';
      document.getElementById('medNombre').value = '';
      document.getElementById('medCantidad').value = '1';
      document.getElementById('medFecha').value = '';
      document.getElementById('fotoInput').value = '';
      document.getElementById('photoPreview').style.display = 'none';
      document.getElementById('medLat').value = '';
      document.getElementById('medLng').value = '';
      document.getElementById('ubicacionTexto').textContent = 'Ubicación: No seleccionada';

      if (typeof marker !== 'undefined' && marker) {
        marker.setMap(null);
      }

      showToast('¡Donación registrada exitosamente!', 'success');
    }

    const user = mediConnect.getUser();

    if (!user) {
      location.href = 'index.html';
    } else if (user.rol !== 'donante') {
      location.href = 'dashboard.html';
    }
