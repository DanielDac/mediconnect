<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />

</head>

<body>
  <div class="page">
    <!-- Header -->
    <div class="app-header fade-up">
      <button class="back-btn" onclick="location.href='dashboard.html'">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
      </button>
      <h1 id="formTitle">Nueva Donación</h1>
    </div>

    <div class="view-content">
      <form class="donation-form fade-up delay-1" id="donationForm" onsubmit="handleSubmit(event)" style="display: flex; flex-direction: column; gap: 20px;">
        
        <!-- Scanner -->
        <div class="scanner-area fade-up" onclick="openScanner()">
          <div class="scanner-icon">
            <svg xmlns="http://www.w3.org/2000/svg" style="width:42px;height:42px;color:var(--primary)" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 3.75H6A2.25 2.25 0 003.75 6v1.5M16.5 3.75H18A2.25 2.25 0 0120.25 6v1.5m0 9V18A2.25 2.25 0 0118 20.25h-1.5m-9 0H6A2.25 2.25 0 013.75 18v-1.5M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </div>
          <span>Escanear Código de Barras</span>
        </div>

        <!-- Código de Barras -->
        <div class="input-group fade-up delay-1">
          <label>Código de Barras</label>
          <div class="input-wrap">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v14.25c0 .621-.504 1.125-1.125 1.125h-4.5a1.125 1.125 0 01-1.125-1.125V4.875zM13.5 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v14.25c0 .621-.504 1.125-1.125 1.125h-4.5a1.125 1.125 0 01-1.125-1.125V4.875z" />
            </svg>
            <input class="input-field" type="text" id="medCodigo" placeholder="Escanear o ingresar código" />
          </div>
        </div>

        <!-- Nombre -->
        <div class="input-group fade-up delay-1">
          <label>Nombre del Medicamento</label>
          <div class="input-wrap">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23-.693L5 14.5m14.8.8l1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0112 21c-2.773 0-5.491-.235-8.135-.687-1.718-.293-2.3-2.379-1.067-3.61L5 14.5" />
            </svg>
            <input class="input-field" type="text" id="medNombre" placeholder="Ej. Ibuprofeno 400mg" />
          </div>
        </div>

        <!-- Tipo + Cantidad -->
        <div class="row-2 fade-up delay-2">
          <div class="input-group">
            <label>Tipo</label>
            <select class="input-field no-icon" id="medTipo">
              <option>Antibiótico</option>
              <option>Antiinflamatorio</option>
              <option>Antidiabético</option>
              <option>Analgésico</option>
              <option>Vitamina</option>
              <option>Otro</option>
            </select>
          </div>
          <div class="input-group">
            <label>Cantidad (un.)</label>
            <input class="input-field no-icon" type="number" id="medCantidad" value="1" min="1" />
          </div>
        </div>

        <!-- Fecha vencimiento -->
        <div class="input-group fade-up delay-3">
          <label>Fecha de Vencimiento</label>
          <div class="input-wrap">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 9v7.5" />
            </svg>
            <input class="input-field" type="date" id="medFecha" />
          </div>
        </div>

        <!-- Foto -->
        <div class="input-group fade-up delay-4">
          <label>Foto del Empaque (Opcional)</label>
          <div class="photo-upload" onclick="document.getElementById('fotoInput').click()">
            <input type="file" id="fotoInput" accept="image/*" onchange="previewPhoto(event)" />
            <div class="photo-upload-icon">📷</div>
            <span>Toca para subir foto</span>
            <img id="photoPreview" />
          </div>
        </div>

        <button class="btn-primary fade-up" id="submitBtn" onclick="submitDonation()" style="margin-top:10px">
          Registrar Donación
        </button>

      </form>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
      </svg>
      Inicio
    </a>
    <a href="buscar.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 15.803a7.5 7.5 0 0010.607 0z" />
      </svg>
      Buscar
    </a>
    <button class="nav-btn-center" onclick="location.href='donar.html'">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
    </button>
    <a href="perfil.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
      </svg>
      Perfil
    </a>
  </nav>

  <!-- QR Modal -->
  <div class="modal-overlay" id="qrOverlay">
    <div class="modal qr-modal-content" id="qrModal">
      <h2>Código de Trazabilidad</h2>
      <p>Escanea este código para ver el estado de la donación.</p>
      <div class="qr-box">
        <div id="qrCode"></div>
      </div>
      <div class="qr-id" id="qrId"></div>
      <button class="btn-secondary" onclick="closeQR()">Cerrar</button>
    </div>
  </div>

  <!-- Scanner Modal -->
  <div class="modal-overlay" id="scannerOverlay">
    <div class="modal" id="scannerModal" style="padding: 15px; text-align: left; max-width: 400px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
        <h2 style="font-size: 1.1rem; margin:0; font-family: var(--font-title); font-weight: 700;">Escanear Código</h2>
        <button class="btn-secondary" style="padding: 6px 12px; margin:0; width: auto; font-size: 13px;" onclick="closeScanner()">Cerrar</button>
      </div>
      <div class="scanner-container" style="position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: #000; min-height: 250px;">
        <video id="scannerVideo" style="width:100%; display:block;" playsinline autoplay muted></video>
        <div class="scan-line"></div>
      </div>
      <p id="scannerStatus" style="margin-top: 15px; font-size: 13px; color: var(--gray-600); text-align: center;">Apunta la cámara al código de barras del medicamento</p>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- QR library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- ZXing barcode reader (UMD) -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script src="app.js"></script>
  <script>
    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast ' + type; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    /* ===== ZXing Barcode Scanner ===== */
    let codeReader = null;
    let scannerStream = null;

    async function openScanner() {
      const overlay = document.getElementById('scannerOverlay');
      const statusEl = document.getElementById('scannerStatus');
      const videoEl = document.getElementById('scannerVideo');

      overlay.classList.add('show');
      statusEl.textContent = 'Iniciando cámara...';
      statusEl.style.color = 'var(--gray-600)';

      try {
        // 1. Configure hints for barcode formats
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
          ZXing.BarcodeFormat.EAN_13,
          ZXing.BarcodeFormat.CODE_128,
          ZXing.BarcodeFormat.UPC_A,
          ZXing.BarcodeFormat.EAN_8,
          ZXing.BarcodeFormat.UPC_E
        ]);
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

        if (!codeReader) {
          codeReader = new ZXing.BrowserMultiFormatReader(hints, 500);
        }

        // 2. Define constraints - Prioritize rear camera (environment)
        const constraints = {
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };

        statusEl.textContent = 'Buscando código de barras...';

        // 3. Start decoding using constraints directly
        // decodeFromConstraints is more robust than listing devices manually
        await codeReader.decodeFromConstraints(
          constraints,
          videoEl,
          (result, error) => {
            if (result) {
              const barcodeNumber = result.getText().trim();
              const formatName = ZXing.BarcodeFormat[result.getBarcodeFormat()] || 'Código';

              // Fill the input
              document.getElementById('medCodigo').value = barcodeNumber;
              showToast('✅ ' + formatName + ': ' + barcodeNumber, 'success');

              // Stop scanning
              closeScanner();
            }
            // NotFoundException is normal during continuous scanning
          }
        );

        // Keep reference to the stream for manual cleanup if needed
        scannerStream = videoEl.srcObject;
        
        // Ensure it's playing
        if (videoEl.paused) {
          await videoEl.play().catch(e => console.warn("Auto-play blocked, waiting for user interaction", e));
        }

      } catch (err) {
        console.error('Error detallado del escáner:', err);
        let msg = 'Error al acceder a la cámara.';
        
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          msg = 'Permiso denegado. Habilita el acceso en la configuración de tu navegador.';
        } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
          msg = 'No se detectó cámara en este dispositivo.';
        } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
          msg = 'La cámara está bloqueada o en uso por otra app.';
        } else if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
          msg = 'El escáner requiere una conexión segura (HTTPS).';
        }
        
        showToast(msg, 'error');
        statusEl.textContent = msg;
        statusEl.style.color = 'var(--danger)';
        
        // Wait a bit before closing so user can read the error
        setTimeout(closeScanner, 3000);
      }
    }

    function closeScanner() {
      document.getElementById('scannerOverlay').classList.remove('show');

      if (codeReader) {
        try {
          codeReader.reset(); // This stops the camera and decoding
        } catch(e) {
          console.error("Error al resetear reader:", e);
        }
      }

      // Fallback manual stop for tracks
      if (scannerStream) {
        try {
          scannerStream.getTracks().forEach(track => track.stop());
        } catch(e) {}
        scannerStream = null;
      }

      // Clear video element
      const videoEl = document.getElementById('scannerVideo');
      if (videoEl) {
        videoEl.pause();
        videoEl.srcObject = null;
      }
    }

    function previewPhoto(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const img = document.getElementById('photoPreview');
        img.src = ev.target.result;
        img.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    let qrInstance = null;

    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('edit');
    let isEditing = false;
    let existingImageUrl = null;

    if (editId) {
      isEditing = true;
      document.querySelector('.donar-header h1').textContent = "Editar Donación";
      document.getElementById('submitBtn').textContent = "Guardar Cambios";
      loadEditData(editId);
    }

    async function loadEditData(id) {
      try {
        const d = await mediConnect.getDonationById(id);
        if (!d) {
          showToast('No se encontró la donación', 'error');
          setTimeout(() => location.href = 'dashboard.html', 1500);
          return;
        }
        
        // Verificar que sea el dueño
        const user = mediConnect.getUser();
        if (d.donante_id !== user.id) {
           location.href = 'dashboard.html';
           return;
        }

        document.getElementById('medCodigo').value = d.codigo_barras || '';
        document.getElementById('medNombre').value = d.nombre;
        document.getElementById('medTipo').value = d.tipo;
        document.getElementById('medCantidad').value = d.cantidad;
        document.getElementById('medFecha').value = d.fecha_vencimiento;
        if (d.imagen_url) {
          const img = document.getElementById('photoPreview');
          img.src = d.imagen_url;
          img.style.display = 'block';
          existingImageUrl = d.imagen_url;
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function submitDonation() {
      const user = mediConnect.getUser();
      if (!user) { location.href = 'index.html'; return; }
      const codigo = document.getElementById('medCodigo').value.trim();
      const nombre = document.getElementById('medNombre').value.trim();
      const tipo = document.getElementById('medTipo').value;
      const cant = parseInt(document.getElementById('medCantidad').value);
      const fecha = document.getElementById('medFecha').value;

      if (!nombre) { showToast('Ingresa el nombre del medicamento', 'error'); return; }
      if (!fecha) { showToast('Ingresa la fecha de vencimiento', 'error'); return; }
      if (cant < 1) { showToast('La cantidad debe ser al menos 1', 'error'); return; }

      const hoy = new Date();
      const fechaVenc = new Date(fecha);
      if (fechaVenc <= hoy) {
        showToast('La fecha de vencimiento debe ser futura', 'error');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      const donation = { 
        codigo_barras: codigo,
        nombre, 
        tipo, 
        cantidad: cant, 
        fecha_vencimiento: fecha 
      };
      if (!isEditing) {
        donation.donante_id = user.id;
        donation.estado = 'disponible';
      }

      // --- Subida de imagen ---
      let imagen_url = isEditing ? existingImageUrl : null;
      const fotoFile = document.getElementById('fotoInput').files[0];
      if (fotoFile) {
        imagen_url = await sb.uploadImage(fotoFile);
      }
      donation.imagen_url = imagen_url;

      try {
        let result;
        if (isEditing) {
          result = await mediConnect.updateDonation(editId, donation);
        } else {
          result = await mediConnect.addDonation(donation);
        }

        btn.disabled = false;
        btn.textContent = isEditing ? 'Guardar Cambios' : 'Registrar Donación';

        if (result) {
          if (isEditing) {
            showToast('¡Donación actualizada!', 'success');
            setTimeout(() => location.href = 'dashboard.html', 1200);
          } else {
            showQR(result.id || ('don-' + Math.random().toString(36).substr(2, 6)));
          }
        } else {
          showToast('Error al procesar la solicitud', 'error');
        }
      } catch (error) {
        btn.disabled = false;
        btn.textContent = isEditing ? 'Guardar Cambios' : 'Registrar Donación';
        showToast('Error de conexión', 'error');
      }
    }

    function showQR(id) {
      const overlay = document.getElementById('qrOverlay');
      const container = document.getElementById('qrCode');
      
      // Limpiar QR anterior
      container.innerHTML = '';
      
      // Mostrar el ID y enlace
      document.getElementById('qrId').innerHTML = 
        `ID: ${id}<br><a href="detalle.html?id=${id}" style="font-size:12px;color:var(--primary);text-decoration:underline;margin-top:4px;display:inline-block;">Ver detalle →</a>`;
      
      try {
        // Generar nuevo QR funcional para Netlify
        new QRCode(container, {
          text: `https://lively-salmiakki-0faf02.netlify.app/detalle.html?id=${id}`, 
          width: 160,
          height: 160,
          colorDark: "#1F2937",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      } catch (e) {
        console.error("Error generando QR:", e);
      }
      
      overlay.classList.add('show');
    }

    function closeQR() {
      document.getElementById('qrOverlay').classList.remove('show');
      // Reset form
      document.getElementById('medNombre').value = '';
      document.getElementById('medCantidad').value = '1';
      document.getElementById('medFecha').value = '';
      document.getElementById('photoPreview').style.display = 'none';
      showToast('¡Donación registrada exitosamente!', 'success');
      setTimeout(() => location.href = 'dashboard.html', 1200);
    }

    const user = mediConnect.getUser();
    if (!user) location.href = 'index.html';
    else if (user.rol !== 'donante') location.href = 'dashboard.html';
  </script>
</body>
