<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediConnect - Mis Actividades</title>
  <link rel="stylesheet" href="style.css?v=1.1">
  <style>
    /* Ajustes específicos para esta página que no están en style.css */
    .header {
      background: var(--white);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--gray-100);
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
    }
    .back-btn {
      background: none;
      border: none;
      color: var(--gray-800);
      cursor: pointer;
      display: flex;
    }
    .header h1 { font-size: 18px; font-weight: 800; font-family: var(--font-title); }
    
    .search-box {
      background: var(--white);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      border: 1px solid var(--gray-200);
    }
    .search-box input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font-main);
    }

    .list-container { display: flex; flex-direction: column; gap: 12px; }
    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state p { color: var(--gray-400); font-weight: 600; margin-top: 10px; }
  </style>
</head>
<body>

<div class="page">
  <div class="header">
    <button class="back-btn" onclick="location.href='perfil.html'">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
    </button>
    <h1 id="pageTitle">Mis Actividades</h1>
  </div>

  <div class="content" style="padding: 20px;">
    <div class="search-box">
      <svg width="18" height="18" fill="none" stroke="var(--gray-400)" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar medicamento..." oninput="filterItems()">
    </div>

    <div id="itemsList" class="list-container">
      <!-- Cargando... -->
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
      Inicio
    </a>
    <a href="buscar.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 15.803a7.5 7.5 0 0010.607 0z"/></svg>
      Buscar
    </a>
    <button class="nav-btn-center" id="addDonationBtn" onclick="location.href='donar.html'">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
    </button>
    <a href="perfil.html" class="nav-item active">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
      Perfil
    </a>
  </nav>
</div>

<script src="app.js"></script>
<script>
  const MEDICINE_EMOJIS = { 'Antibiótico':'💊', 'Antiinflamatorio':'🩹', 'Antidiabético':'💉', 'Analgésico':'🔴', 'default':'📦' };
  const STATUS_MAP = { 
    'disponible': 'badge-success', 
    'reservado': 'badge-warning', 
    'aprobado': 'badge-blue', 
    'entregado': 'badge-success',
    'rechazado': 'badge-danger' 
  };
  const ICON_COLORS = ['#EEF2FF', '#F0FDF4', '#FEF2F2', '#FFFBEB'];

  let allItems = [];

  async function load() {
    const user = mediConnect.getUser();
    if (!user) { location.href = 'index.html'; return; }

    // Ocultar botón "+" si no es donante
    const btnAdd = document.getElementById('addDonationBtn');
    if (btnAdd && user.rol !== 'donante') btnAdd.style.display = 'none';

    const title = document.getElementById('pageTitle');
    const donations = await mediConnect.getDonations();
    
    if (user.rol === 'donante') {
      title.textContent = "Mis Donaciones";
      allItems = donations.filter(d => d.donante_id === user.id);
    } else if (user.rol === 'receptor') {
      title.textContent = "Mis Reservas";
      allItems = donations.filter(d => d.receptor_id === user.id);
    } else {
      title.textContent = "Historial General";
      allItems = donations;
    }

    render(allItems);
  }

  function render(items) {
    const list = document.getElementById('itemsList');
    if (items.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div style="font-size:40px;">📭</div>
          <p>No se encontraron resultados</p>
        </div>
      `;
      return;
    }

    list.innerHTML = items.map((d, i) => `
      <div class="med-card">
        <div class="med-img" style="background:${ICON_COLORS[i % ICON_COLORS.length]}">
          ${MEDICINE_EMOJIS[d.tipo] || MEDICINE_EMOJIS.default}
        </div>
        <div class="med-info">
          <h3>${d.nombre}</h3>
          <p>${d.tipo} · ${d.cantidad} un.</p>
          <div class="med-meta">
            <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            ${new Date(d.created_at || Date.now()).toLocaleDateString('es-ES', {day:'2-digit', month:'short'})}
          </div>
        </div>
        <span class="badge ${STATUS_MAP[d.estado] || 'badge-blue'}">${d.estado}</span>
      </div>
    `).join('');
  }

  function filterItems() {
    const term = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allItems.filter(d => 
      d.nombre.toLowerCase().includes(term) || 
      d.tipo.toLowerCase().includes(term)
    );
    render(filtered);
  }

  load();
</script>

</body>
</html>
