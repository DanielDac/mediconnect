<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediConnect – Mis Actividades</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">
  <!-- Header -->
  <div class="app-header fade-up">
    <button class="back-btn" onclick="location.href='perfil.html'">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
    </button>
    <h1 id="pageTitle">...</h1>
  </div>

  <div class="view-content" id="activitiesList">
    <div class="search-box fade-up delay-1" style="margin-bottom: 20px;">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="var(--gray-400)"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 15.803a7.5 7.5 0 0010.607 0z"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar medicamento..." oninput="filterItems()">
    </div>

    <div id="itemsList" class="results-list fade-up delay-2">
      <!-- Se carga dinámicamente -->
    </div>
  </div>

  <!-- Bottom Nav idéntica a perfil.html -->
  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
      Inicio
    </a>
    <a href="buscar.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 15.803a7.5 7.5 0 0010.607 0z"/></svg>
      Buscar
    </a>
    <button class="nav-btn-center" id="addDonationBtn" onclick="location.href='donar.html'">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
    </button>
    <a href="mapa.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 6.75V15m6-6v8.25m.503 3.498l4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934c-.317.159-.69.159-1.006 0L9.503 3.252a1.125 1.125 0 00-1.006 0L3.622 5.689C3.24 5.88 3 6.27 3 6.695V19.18c0 .836.88 1.38 1.628 1.006l3.869-1.934c.317-.159.69-.159 1.006 0l4.994 2.497c.317.158.69.158 1.006 0z" /></svg>
      Mapa
    </a>
    <a href="perfil.html" class="nav-item active">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
      Perfil
    </a>
  </nav>
</div>

<script src="app.js"></script>
<script>
  const MEDICINE_EMOJIS = { 'Antibiótico':'💊', 'Antiinflamatorio':'🩹', 'Antidiabético':'💉', 'Analgésico':'🔴', 'Vitamina':'🍋', 'default':'📦' };
  const STATUS_MAP = { 
    'disponible': 'badge-success', 
    'reservado': 'badge-warning', 
    'aprobado': 'badge-blue', 
    'entregado': 'badge-success',
    'rechazado': 'badge-danger' 
  };
  const ICON_COLORS = ['#F0FDF4', '#FEF3C7', '#EFF6FF', '#F5F3FF'];

  let allItems = [];

  async function load() {
    const user = mediConnect.getUser();
    if (!user) { location.href = 'index.html'; return; }

    const btnAdd = document.getElementById('addDonationBtn');
    if (btnAdd && user.rol !== 'donante') btnAdd.style.display = 'none';

    const title = document.getElementById('pageTitle');
    
    if (user.rol === 'donante') title.textContent = "Mis Donaciones";
    else if (user.rol === 'receptor') title.textContent = "Mis Reservas";
    else title.textContent = "Historial General";

    const donations = await mediConnect.getDonations();
    
    if (user.rol === 'donante') {
      allItems = donations.filter(d => d.donante_id === user.id);
    } else if (user.rol === 'receptor') {
      allItems = donations.filter(d => d.receptor_id === user.id);
    } else {
      title.textContent = "Historial General";
      allItems = donations;
    }

    render(allItems);
  }

  function render(items) {
    const list = document.getElementById('itemsList');
    if (items.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div style="font-size:40px; margin-bottom:10px;">📭</div>
          <p>No se encontraron actividades</p>
        </div>
      `;
      return;
    }

    list.innerHTML = items.map((d, i) => `
      <div class="med-card" style="cursor:pointer;" onclick="location.href='detalle.html?id=${d.id}'">
        <div class="med-img" style="background:${ICON_COLORS[i % ICON_COLORS.length]}">
          ${MEDICINE_EMOJIS[d.tipo] || MEDICINE_EMOJIS.default}
        </div>
        <div class="med-info">
          <h3>${d.nombre}</h3>
          <p>${d.tipo} · ${d.cantidad} un.</p>
          <div class="med-meta">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            ${new Date(d.created_at || Date.now()).toLocaleDateString('es-ES', {day:'2-digit', month:'short', year:'numeric'})}
          </div>
        </div>
        <span class="badge ${STATUS_MAP[d.estado] || 'badge-blue'}">${d.estado}</span>
      </div>
    `).join('');
  }

  function filterItems() {
    const term = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allItems.filter(d => 
      d.nombre.toLowerCase().includes(term) || 
      d.tipo.toLowerCase().includes(term)
    );
    render(filtered);
  }

  load();
</script>

</body>
</html>
