  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  </script>
  <script>
    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast ' + type; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    async function handleLogout() {
      console.log('🔄 Cerrando sesión...');

      // Cerrar sesión de Google
      try {
        await supabaseClient.auth.signOut();
        console.log(' Sesión Google cerrada');
      } catch (e) {
        console.log('No había sesión de Google');
      }

      // Limpiar localStorage
      mediConnect.logout();
      localStorage.clear();

      // Limpiar cookies
      document.cookie.split(';').forEach(c => {
        document.cookie = c.replace(/^ +/, '').replace(/=.*/, '=;expires=' + new Date().toUTCString() + ';path=/');
      });

      // Redirigir
      window.location.replace('index.html');
    }
    async function loadProfile() {
      // Verificar sesión de Google primero
      const { data: { session } } = await supabaseClient.auth.getSession();

      let user = mediConnect.getUser();

      // Si hay sesión de Google pero no local, sincronizar
      if (session?.user && !user) {
        const email = session.user.email;
        const query = `email=eq.${encodeURIComponent(email)}`;
        const users = await sb.select('usuarios', query);
        if (users && users.length > 0) {
          mediConnect.saveUser(users[0]);
          user = users[0];
        }
      }

      if (!user) {
        window.location.href = 'index.html';
        return;
      }

      // Mostrar nombre y avatar
      document.getElementById('profileName').textContent = user.nombre || 'Usuario';

      // Si hay avatar de Google, mostrarlo
      if (session?.user?.user_metadata?.avatar_url) {
        document.getElementById('avatarLg').innerHTML =
          `<img src="${session.user.user_metadata.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
      } else {
        document.getElementById('avatarLg').textContent = user.nombre.charAt(0).toUpperCase();
      }

      const badgeEl = document.querySelector('.profile-badge');
      const historyLabel = document.getElementById('historyLabel');
      const privacyItem = document.getElementById('privacyItem');
      const adminItem = document.getElementById('adminPanelBtn');

      if (user.rol === 'validador') {
        badgeEl.innerHTML = '🛡️ VALIDADOR OFICIAL';
        historyLabel.textContent = "Ver mi historial";
        if (privacyItem) privacyItem.style.display = 'none';
        if (adminItem) {
          adminItem.style.display = 'flex';
          adminItem.querySelector('.account-item-label').textContent = "Panel Administrativo";
        }
      }
      else if (user.rol === 'receptor') {
        badgeEl.innerHTML = '📦 RECEPTOR';
        historyLabel.textContent = "Mis Reservas";
        if (privacyItem) privacyItem.style.display = 'flex';
        if (adminItem) adminItem.style.display = 'none';
      }
      else {
        badgeEl.innerHTML = '⭐ DONANTE ESTRELLA';
        historyLabel.textContent = "Mis Donaciones";
        if (privacyItem) privacyItem.style.display = 'flex';
        if (adminItem) adminItem.style.display = 'none';
      }

      const btnAdd = document.getElementById('addDonationBtn');
      if (btnAdd && user.rol !== 'donante') btnAdd.style.display = 'none';

      loadRequests(user);
    }

    async function loadRequests(user) {
      if (user.rol === 'validador') return;
      const area = document.getElementById('validatorRequestArea');
      area.innerHTML = `
      <div class="account-item" onclick="handleValidatorRequest()" id="reqBtn">
        <div class="account-item-icon" style="background:#E0F2FE;">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="#0284C7"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/></svg>
        </div>
        <span class="account-item-label" style="color:#0284C7;">Solicitar acceso como Validador</span>
        <span class="account-item-arrow"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg></span>
      </div>
    `;
    }

    async function handleValidatorRequest() {
      const result = await mediConnect.requestValidatorRole();
      if (result && result.success) {
        showToast('Solicitud enviada correctamente', 'success');
        document.getElementById('validatorRequestArea').innerHTML = `
        <p style="font-size:12px; color:var(--gray-400); text-align:center; padding:10px;">Tu solicitud está en revisión.</p>
      `;
      } else {
        if (result && result.message === 'duplicate') {
          showToast('Ya tienes una solicitud pendiente', 'warning');
          document.getElementById('validatorRequestArea').innerHTML = `
          <p style="font-size:12px; color:var(--gray-400); text-align:center; padding:10px;">Tu solicitud ya está en revisión.</p>
        `;
        } else {
          const msg = (result && result.message) ? result.message : 'Error al enviar solicitud';
          showToast(msg, 'error');
        }
      }
    }

    loadProfile();
  </script>
