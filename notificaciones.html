<head>

<body>
  <div class="page">

      <button class="back-btn" onclick="location.href='perfil.html'">

  <!-- Bottom Nav -->
  <nav class="bottom-nav">

    <a href="dashboard.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
        stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
      </svg>
      Inicio

    <a href="buscar.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"

        <path stroke-linecap="round" stroke-linejoin="round"
          d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 15.803a7.5 7.5 0 0010.607 0z" />
      </svg>
      Buscar
    </a>

    <button class="nav-btn-center"
      id="addDonationBtn"
      onclick="location.href='donar.html'"
      style="display:none;">
      <svg xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"

          d="M12 4.5v15m7.5-7.5h-15" />

    <a href="mapa.html" class="nav-item">

    <a href="perfil.html" class="nav-item active">

          stroke-linejoin="round"
          d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
      </svg>
      Perfil

  <script src="app.js"></script>

  <script>

    const user = mediConnect.getUser();

    if (!user) {
      location.href = 'index.html';
    }

    // Mostrar botón "+" solo si es donante
    const btnAdd = document.getElementById('addDonationBtn');

    if (btnAdd) {
      btnAdd.style.display = user.rol === 'donante'
        ? 'flex'
        : 'none';
    }

    async function cargarNotificaciones() {

      const container = document.getElementById('notifContainer');

      try {

        const query =
          `or=(usuario_id.eq.${user.id},usuario_id.is.null)&order=created_at.desc&limit=20`;

        let notificaciones = [];

        try {

          notificaciones = await sb.select(
            'notificaciones',
            query
          );

        } catch (e) {

          container.innerHTML = `
            <div style="text-align:center;padding:40px;color:var(--gray-400);">
              <p style="font-size:40px;">🔔</p>
              <p>No hay notificaciones disponibles.</p>
            </div>
          `;

          return;
        }

        if (!notificaciones || !notificaciones.length) {

          container.innerHTML = `
            <div style="text-align:center;padding:40px;color:var(--gray-400);">
              <p style="font-size:40px;">🔔</p>
              <p>No tienes notificaciones.</p>
            </div>
          `;

          return;
        }

        container.innerHTML = notificaciones.map((n, i) => `

          <div class="fade-up delay-${i + 1}"
            onclick="marcarLeida('${n.id}')"
            style="
              padding:16px;
              background:var(--white);
              border-radius:var(--radius);
              box-shadow:var(--shadow-sm);
              ${!n.leida
                ? 'border-left:4px solid var(--primary);'
                : 'opacity:0.7;'
              };
              position:relative;
              cursor:pointer;
            ">

            <div style="
              display:flex;
              justify-content:space-between;
              align-items:flex-start;
            ">

              <h3 style="
                font-size:14px;
                font-weight:700;
                color:var(--gray-800);
              ">
                ${!n.leida ? '🔵 ' : ''}
                ${escapeHtml(n.titulo)}
              </h3>

              <div style="
                display:flex;
                align-items:center;
                gap:8px;
              ">

                <span style="
                  font-size:10px;
                  color:var(--gray-400);
                ">
                  ${formatearFecha(n.created_at)}
                </span>

                <button
                  onclick="event.stopPropagation();eliminarNotificacion('${n.id}')"
                  style="
                    background:none;
                    border:none;
                    color:#EF4444;
                    cursor:pointer;
                    font-size:14px;
                    padding:2px 4px;
                  ">
                  🗑️
                </button>

              </div>
            </div>

            <p style="
              font-size:12px;
              color:var(--gray-500);
              margin-top:4px;
            ">
              ${escapeHtml(n.mensaje)}
            </p>

            <span style="
              font-size:10px;
              color:var(--primary);
              font-weight:700;
            ">
              ${n.usuario_id ? '👤 Personal' : '📢 General'}
            </span>

          </div>

        `).join('');

      } catch (error) {

        container.innerHTML = `
          <div style="text-align:center;padding:40px;color:var(--gray-400);">
            Error al cargar.
          </div>
        `;
      }
    }

    async function marcarLeida(id) {

      try {

        await sb.update(
          'notificaciones',
          id,
          { leida: true }
        );

        cargarNotificaciones();

      } catch (e) {}
    }

    async function eliminarNotificacion(id) {

      if (!confirm('¿Eliminar esta notificación?')) return;

      try {

        await sb.delete('notificaciones', id);

        cargarNotificaciones();

      } catch (e) {}
    }

    function formatearFecha(fecha) {

      if (!fecha) return '';

      const d = new Date(fecha);
      const ahora = new Date();

      const diff = Math.floor(
        (ahora - d) / (1000 * 60 * 60 * 24)
      );

      if (diff === 0) return 'Hoy';

      if (diff === 1) return 'Ayer';

      return d.toLocaleDateString(
        'es-GT',
        {
          day: '2-digit',
          month: 'short'
        }
      );
    }

    function escapeHtml(value) {

      return String(value ?? '').replace(
        /[&<>'"]/g,
        char => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[char])
      );
    }

    cargarNotificaciones();

  </script>
</body>

</html>
