<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediConnect – Notificaciones</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="page">
    <div class="app-header fade-up">
      <button class="back-btn" onclick="location.href='perfil.html'">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
        </svg>
      </button>
      <h1>Notificaciones</h1>
    </div>

    <div class="view-content" id="notifContainer" style="padding-top:20px;display:flex;flex-direction:column;gap:12px;">
      <p style="text-align:center;color:var(--gray-400);padding:20px;">Cargando notificaciones...</p>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const user = mediConnect.getUser();
    if (!user) { location.href = 'index.html'; }

    async function cargarNotificaciones() {
      const container = document.getElementById('notifContainer');
      try {
        const query = `or=(usuario_id.eq.${user.id},usuario_id.is.null)&order=created_at.desc&limit=20`;
        let notificaciones = [];
        try {
          notificaciones = await sb.select('notificaciones', query);
        } catch (e) {
          container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--gray-400);">
            <p style="font-size:40px;">🔔</p><p>No hay notificaciones disponibles.</p></div>`;
          return;
        }

        if (!notificaciones || !notificaciones.length) {
          container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--gray-400);">
            <p style="font-size:40px;">🔔</p><p>No tienes notificaciones.</p></div>`;
          return;
        }

        container.innerHTML = notificaciones.map((n, i) => `
          <div class="fade-up delay-${i + 1}" 
               onclick="marcarLeida('${n.id}')"
               style="padding:16px;background:var(--white);border-radius:var(--radius);
                      box-shadow:var(--shadow-sm);${!n.leida ? 'border-left:4px solid var(--primary);' : 'opacity:0.7;'};
                      position:relative;cursor:pointer;">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
              <h3 style="font-size:14px;font-weight:700;color:var(--gray-800);">${!n.leida ? '🔵 ' : ''}${escapeHtml(n.titulo)}</h3>
              <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-size:10px;color:var(--gray-400);">${formatearFecha(n.created_at)}</span>
                <button onclick="event.stopPropagation();eliminarNotificacion('${n.id}')" 
                        style="background:none;border:none;color:#EF4444;cursor:pointer;font-size:14px;padding:2px 4px;">🗑️</button>
              </div>
            </div>
            <p style="font-size:12px;color:var(--gray-500);margin-top:4px;">${escapeHtml(n.mensaje)}</p>
            <span style="font-size:10px;color:var(--primary);font-weight:700;">${n.usuario_id ? '👤 Personal' : '📢 General'}</span>
          </div>
        `).join('');
      } catch (error) {
        container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--gray-400);">Error al cargar.</div>`;
      }
    }

    async function marcarLeida(id) {
      try {
        await sb.update('notificaciones', id, { leida: true });
        cargarNotificaciones();
      } catch (e) {}
    }

    async function eliminarNotificacion(id) {
      if (!confirm('¿Eliminar esta notificación?')) return;
      try {
        await sb.delete('notificaciones', id);
        cargarNotificaciones();
      } catch (e) {}
    }

    function formatearFecha(fecha) {
      if (!fecha) return '';
      const d = new Date(fecha);
      const ahora = new Date();
      const diff = Math.floor((ahora - d) / (1000 * 60 * 60 * 24));
      if (diff === 0) return 'Hoy';
      if (diff === 1) return 'Ayer';
      return d.toLocaleDateString('es-GT', { day: '2-digit', month: 'short' });
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, char => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;'
      }[char]));
    }

    cargarNotificaciones();
  </script>
</body>
</html>
