<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MediConnect – Panel Admin</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .admin-header {
      background: var(--white);
      padding: 52px 20px 16px;
      border-bottom: 1px solid var(--gray-100);
      display: flex; align-items: center; justify-content: space-between;
    }
    .admin-header h1 { font-family: var(--font-title); font-size: 20px; font-weight: 800; color: var(--gray-800); }
    
    .admin-content { padding: 20px; }
    
    .req-card {
      background: var(--white);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-100);
      display: flex; flex-direction: column; gap: 12px;
    }
    .req-user { display: flex; align-items: center; gap: 12px; }
    .req-avatar { width: 44px; height: 44px; background: var(--primary-light); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
    .req-info h3 { font-size: 15px; font-weight: 700; color: var(--gray-800); }
    .req-info p { font-size: 12px; color: var(--gray-400); }
    
    .req-actions { display: flex; gap: 8px; }
    .btn-approve { background: #10B981; color: white; border: none; padding: 10px; border-radius: 10px; flex: 1; font-weight: 700; font-size: 13px; cursor: pointer; transition: opacity 0.2s; }
    .btn-reject { background: var(--gray-100); color: var(--gray-600); border: none; padding: 10px; border-radius: 10px; flex: 1; font-weight: 700; font-size: 13px; cursor: pointer; }
    .btn-approve:hover, .btn-reject:hover { opacity: 0.8; }

    /* Modal Access */
    #accessModal {
      position: fixed; top: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px; height: 100%;
      background: var(--gray-800); z-index: 1000;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .access-box {
      background: var(--white); width: 100%; max-width: 320px;
      padding: 30px 24px; border-radius: 24px; text-align: center;
      box-shadow: var(--shadow-lg);
    }
    .access-box h2 { font-family: var(--font-title); margin-bottom: 10px; }
    .access-box p { font-size: 14px; color: var(--gray-400); margin-bottom: 20px; }
  </style>
</head>
<body>
  <div id="accessModal">
    <div class="access-box">
      <h2>Acceso Maestro</h2>
      <p>Introduce la clave de administrador para continuar.</p>
      <input type="password" id="masterKey" class="input-field" placeholder="Clave Maestra" style="margin-bottom:16px; text-align:center;">
      <button class="btn-primary" onclick="verifyKey()">Entrar al Panel</button>
      <button class="btn-secondary" style="margin-top:10px;" onclick="location.href='dashboard.html'">Cancelar</button>
    </div>
  </div>

  <div class="page" id="adminPage" style="display:none;">
    <div class="app-header fade-up">
      <button class="back-btn" onclick="location.href='perfil.html'">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
      </button>
      <h1>Administración</h1>
    </div>

    <div class="view-content" id="requestsList" style="padding-top: 20px;">
      <p style="text-align:center; color:var(--gray-400); margin-top:40px;">Cargando solicitudes...</p>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
  <script>
    const MASTER_PASSWORD = 'admin123'; // Clave por defecto (Cámbiala en producción)

    function showToast(msg, type='') {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast ' + type; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    function verifyKey() {
      const input = document.getElementById('masterKey').value;
      if (input === MASTER_PASSWORD) {
        document.getElementById('accessModal').style.display = 'none';
        document.getElementById('adminPage').style.display = 'block';
        loadRequests();
      } else {
        showToast('Clave incorrecta', 'error');
      }
    }

    async function loadRequests() {
      const list = await mediConnect.getValidatorRequests();
      const container = document.getElementById('requestsList');
      
      if (list.length === 0) {
        container.innerHTML = `<div style="text-align:center; margin-top:60px;">
          <div style="font-size:40px; margin-bottom:10px;">✅</div>
          <p style="color:var(--gray-400);">No hay solicitudes pendientes.</p>
        </div>`;
        return;
      }

      container.innerHTML = list.map(req => `
        <div class="req-card fade-up">
          <div class="req-user">
            <div class="req-avatar">${req.nombre.charAt(0).toUpperCase()}</div>
            <div class="req-info">
              <h3>${req.nombre}</h3>
              <p>${req.email}</p>
            </div>
          </div>
          <div class="req-actions">
            <button class="btn-reject" onclick="process('${req.id}', 'rechazado', '${req.usuario_id}')">Rechazar</button>
            <button class="btn-approve" onclick="process('${req.id}', 'aprobado', '${req.usuario_id}')">Aprobar Acceso</button>
          </div>
        </div>
      `).join('');
    }

    async function process(reqId, status, userId) {
      if (!confirm(`¿Estás seguro de ${status === 'aprobado' ? 'aprobar' : 'rechazar'} esta solicitud?`)) return;
      
      const ok = await mediConnect.processValidatorRequest(reqId, status, userId);
      if (ok) {
        showToast(`Usuario ${status}`, 'success');
        loadRequests();
      } else {
        showToast('Error al procesar', 'error');
      }
    }
  </script>
</body>
</html>
