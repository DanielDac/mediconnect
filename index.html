<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediConnect – Inicio</title>
  <link rel="stylesheet" href="style.css" />

  <script>
    (function () {
      const user = localStorage.getItem("mc_user");
      if (user) {
        try {
          const parsed = JSON.parse(user);
          if (parsed && parsed.id) {
            window.location.replace("dashboard.html");
          }
        } catch (e) { }
      }
    })();
  </script>

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0 0 40px 0;
    }

    .auth-hero {
      background: linear-gradient(160deg, #1e40af 0%, #3b82f6 60%, #60a5fa 100%);
      padding: 48px 24px 56px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .auth-hero::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 50%;
      bottom: -80px;
      right: -60px;
    }

    .auth-hero::after {
      content: "";
      position: absolute;
      width: 140px;
      height: 140px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 50%;
      top: -30px;
      left: -30px;
    }

    .logo-icon {
      width: 70px;
      height: 70px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      position: relative;
      z-index: 1;
    }

    .logo-icon svg {
      width: 36px;
      height: 36px;
      color: white;
    }

    .auth-hero h1 {
      font-family: var(--font-title);
      font-size: 28px;
      font-weight: 700;
      color: white;
      margin-bottom: 6px;
      position: relative;
      z-index: 1;
    }

    .auth-hero p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.82);
      position: relative;
      z-index: 1;
    }

    .auth-card {
      background: var(--white);
      border-radius: 24px 24px 0 0;
      margin-top: -20px;
      padding: 28px 24px;
      flex: 1;
      position: relative;
      z-index: 2;
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.07);
    }

    .google-auth-section {
      margin-bottom: 20px;
    }

    .google-auth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px;
      background: var(--white);
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 700;
      font-family: var(--font-main);
      color: var(--gray-800);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .google-auth-btn:hover {
      border-color: #4285f4;
      background: #f8fbff;
      box-shadow: 0 4px 12px rgba(66, 133, 244, 0.15);
      transform: translateY(-1px);
    }

    .google-auth-btn:active {
      transform: scale(0.98);
    }

    .google-auth-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .google-auth-btn img {
      width: 20px;
      height: 20px;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--gray-200);
    }

    .auth-divider span {
      font-size: 12px;
      font-weight: 700;
      color: var(--gray-400);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .auth-tabs {
      display: flex;
      background: var(--gray-100);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .auth-tab {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      font-family: var(--font-main);
      color: var(--gray-400);
      cursor: pointer;
      transition: all 0.2s;
    }

    .auth-tab.active {
      background: var(--white);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .role-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--gray-600);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .role-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .role-btn {
      border: 2px solid var(--gray-200);
      border-radius: var(--radius);
      padding: 14px 8px;
      background: var(--white);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      font-family: var(--font-main);
      color: var(--gray-600);
      transition: all 0.2s;
    }

    .role-btn.active {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }

    .role-btn svg {
      width: 22px;
      height: 22px;
    }

    .role-btn.active svg {
      stroke: var(--primary);
    }

    .form-section {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .form-section.visible {
      display: flex;
    }

    .footer-text {
      text-align: center;
      font-size: 12px;
      color: var(--gray-400);
      margin-top: 20px;
    }

    .register-link {
      text-align: center;
      font-size: 13px;
      margin-top: 8px;
    }

    .register-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .register-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div id="loadingOverlay" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #1e40af;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.3s;
  ">
    <div style="text-align: center; color: white;">
      <div class="spinner" style="
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255,255,255,0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px;
      "></div>
      <p style="font-family: var(--font-main); font-weight: 600;">Cargando...</p>
    </div>
  </div>

  <div class="auth-page page-no-nav">
    <div class="auth-hero fade-up">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 12h3m0 0h3m-3 0V9m0 3v3M4.5 19.5h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15A2.25 2.25 0 002.25 6.75v10.5A2.25 2.25 0 004.5 19.5z" />
        </svg>
      </div>
      <h1>MediConnect</h1>
      <p>Conectando salud, salvando vidas.</p>
    </div>

    <div class="auth-card">
      <div class="google-auth-section fade-up delay-1">
        <button onclick="signInWithGoogle()" class="google-auth-btn" id="googleAuthBtn">
          <img src="https://www.google.com/favicon.ico" alt="Google" />
          Continuar con Google
        </button>
      </div>

      <div class="auth-divider fade-up delay-1">
        <span>o continúa con email</span>
      </div>

      <div class="auth-tabs fade-up delay-2">
        <button class="auth-tab active" onclick="switchTab('login')">
          Iniciar Sesión
        </button>
        <button class="auth-tab" onclick="switchTab('register')">
          Registrarse
        </button>
      </div>

      <div class="form-section visible fade-up delay-2" id="loginForm">
        <div class="input-group">
          <label>Email</label>
          <div class="input-wrap">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
              stroke-width="1.8" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
            </svg>
            <input class="input-field" type="email" id="loginEmail" placeholder="correo@ejemplo.com" />
          </div>
        </div>

        <div class="input-group">
          <label>Contraseña</label>
          <div class="input-wrap">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
              stroke-width="1.8" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
            </svg>
            <input class="input-field" type="password" id="loginPassword" placeholder="Tu contraseña" />
          </div>
        </div>

        <button class="btn-primary" id="loginBtn" onclick="handleLogin()">
          Ingresar
        </button>

        <p class="register-link">
          <a href="#" onclick="switchTab('register')">¿No tienes cuenta? Regístrate</a>
        </p>
      </div>

      <div class="form-section" id="registerForm">
        <div>
          <p class="role-label">Tipo de Usuario</p>

          <div class="role-grid">
            <button class="role-btn active" onclick="selectRole(this, 'donante')">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
              </svg>
              Donante
              <span style="font-size: 10px; color: var(--gray-400)">Persona/Farmacia</span>
            </button>

            <button class="role-btn" onclick="selectRole(this, 'receptor')">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
              </svg>
              Receptor
              <span style="font-size: 10px; color: var(--gray-400)">Paciente/ONG</span>
            </button>
          </div>
        </div>

        <div class="input-group">
          <label>Nombre Completo</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
            </svg>
            <input class="input-field" type="text" id="regName" placeholder="Ej. Juan Pérez" />
          </div>
        </div>

        <div class="input-group">
          <label>Email</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
            </svg>
            <input class="input-field" type="email" id="regEmail" placeholder="correo@ejemplo.com" />
          </div>
        </div>

        <div class="input-group">
          <label>Contraseña</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
            </svg>
            <input class="input-field" type="password" id="regPassword" placeholder="Mínimo 6 caracteres" />
          </div>
        </div>

        <button class="btn-primary" id="registerBtn" onclick="handleRegister()">
          Crear Cuenta
        </button>

        <p class="register-link">
          <a href="#" onclick="switchTab('login')">¿Ya tienes cuenta? Inicia sesión</a>
        </p>
      </div>

      <p class="footer-text">© 2026 MediConnect. Protegemos tus datos.</p>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>

  <script>
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let selectedRole = "donante";

    document.addEventListener("DOMContentLoaded", function () {
      const loginBtn = document.getElementById("loginBtn");
      const registerBtn = document.getElementById("registerBtn");

      if (loginBtn) loginBtn.dataset.label = "Ingresar";
      if (registerBtn) registerBtn.dataset.label = "Crear Cuenta";

      initAuthPage();
    });

    async function initAuthPage() {
      const googleProcessed = await handleGoogleRedirect();

      if (googleProcessed) return;

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (session?.user) {
        await processSupabaseUser(session.user);
        return;
      }

      const localUser = mediConnect.getUser();

      if (localUser) {
        redirectBasedOnRole(localUser.rol);
        return;
      }

      hideLoadingOverlay();
    }

    function hideLoadingOverlay() {
      const overlay = document.getElementById("loadingOverlay");

      if (overlay) {
        overlay.style.opacity = "0";
        setTimeout(() => overlay.remove(), 300);
      }
    }

    async function handleGoogleRedirect() {
      const hasToken =
        window.location.hash && window.location.hash.includes("access_token");

      if (!hasToken) return false;

      try {
        await new Promise(resolve => setTimeout(resolve, 1000));

        const {
          data: { session },
          error
        } = await supabaseClient.auth.getSession();

        if (error || !session?.user) {
          hideLoadingOverlay();
          return false;
        }

        await processSupabaseUser(session.user);
        return true;
      } catch (error) {
        console.error("Error en Google Redirect:", error);
        showToast("Error al iniciar con Google", "error");
        hideLoadingOverlay();
        return false;
      }
    }

    async function processSupabaseUser(authUser) {
      const email = authUser.email;
      const name = authUser.user_metadata?.full_name || email.split("@")[0];

      const query = `email=eq.${encodeURIComponent(email)}`;
      const users = await sb.select("usuarios", query);

      if (users && users.length > 0) {
        const user = users[0];

        if (!user.avatar_url && authUser.user_metadata?.avatar_url) {
          await sb.update("usuarios", user.id, {
            avatar_url: authUser.user_metadata.avatar_url
          });

          user.avatar_url = authUser.user_metadata.avatar_url;
        }

        mediConnect.saveUser(user);
        redirectBasedOnRole(user.rol);
        return;
      }

      const newUser = {
        nombre: name,
        email: email,
        password: "google_" + Date.now(),
        rol: "donante",
        avatar_url: authUser.user_metadata?.avatar_url || null
      };

      const createdUser = await sb.insert("usuarios", newUser);

      if (createdUser && createdUser.id) {
        mediConnect.saveUser(createdUser);
        redirectBasedOnRole(createdUser.rol);
        return;
      }

      showToast("No se pudo crear el usuario con Google", "error");
      hideLoadingOverlay();
    }

    async function signInWithGoogle() {
      const googleBtn = document.getElementById("googleAuthBtn");

      try {
        if (googleBtn) {
          googleBtn.innerHTML = '<span class="spinner"></span> Conectando...';
          googleBtn.disabled = true;
        }

        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: "google",
          options: {
            redirectTo: window.location.origin + "/index.html"
          }
        });

        if (error) throw error;
      } catch (error) {
        console.error(error);

        if (googleBtn) {
          googleBtn.innerHTML =
            '<img src="https://www.google.com/favicon.ico" alt="Google" /> Continuar con Google';
          googleBtn.disabled = false;
        }

        showToast("Error al conectar con Google", "error");
      }
    }

    function redirectBasedOnRole(rol) {
      const pages = {
        donante: "dashboard.html",
        receptor: "dashboard.html",
        validador: "dashboard.html",
        administrador: "dashboard.html"
      };

      window.location.href = pages[rol] || "dashboard.html";
    }

    function switchTab(tab) {
      document.querySelectorAll(".auth-tab").forEach(function (button, index) {
        const isLogin = index === 0 && tab === "login";
        const isRegister = index === 1 && tab === "register";
        button.classList.toggle("active", isLogin || isRegister);
      });

      document.getElementById("loginForm").classList.toggle("visible", tab === "login");
      document.getElementById("registerForm").classList.toggle("visible", tab === "register");
    }

    function selectRole(el, role) {
      document.querySelectorAll(".role-btn").forEach(function (button) {
        button.classList.remove("active");
      });

      el.classList.add("active");
      selectedRole = role;
    }

    function showToast(msg, type = "") {
      const toast = document.getElementById("toast");

      if (!toast) return;

      toast.textContent = msg;
      toast.className = "toast " + type;
      toast.classList.add("show");

      setTimeout(function () {
        toast.classList.remove("show");
      }, 2800);
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);

      if (!btn) return;

      btn.disabled = loading;
      btn.innerHTML = loading
        ? '<span class="spinner"></span>'
        : btn.dataset.label;
    }

    async function handleLogin() {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      if (!email || !password) {
        showToast("Ingresa tu email y contraseña", "error");
        return;
      }

      setLoading("loginBtn", true);

      try {
        const ok = await mediConnect.login(email, password);

        if (!ok) {
          showToast("Credenciales incorrectas", "error");
          return;
        }

        const user = mediConnect.getUser();

        showToast("¡Bienvenido, " + user.nombre + "!", "success");

        setTimeout(function () {
          redirectBasedOnRole(user.rol);
        }, 900);
      } catch (error) {
        console.error(error);
        showToast("Error al ingresar", "error");
      } finally {
        setLoading("loginBtn", false);
      }
    }

    async function handleRegister() {
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const pass = document.getElementById("regPassword").value;

      if (!name || !email || !pass) {
        showToast("Completa los campos obligatorios", "error");
        return;
      }

      if (pass.length < 6) {
        showToast("Mínimo 6 caracteres", "error");
        return;
      }

      setLoading("registerBtn", true);

      try {
        const result = await mediConnect.register(
          name,
          email,
          pass,
          selectedRole
        );

        if (
          result === false ||
          result === null ||
          (result && result.success === false)
        ) {
          showToast("El email ya está registrado", "error");

          setTimeout(function () {
            switchTab("login");
          }, 1500);

          return;
        }

        if (result === true || (result && result.success === true)) {
          showToast("¡Cuenta creada exitosamente!", "success");

          document.getElementById("regName").value = "";
          document.getElementById("regEmail").value = "";
          document.getElementById("regPassword").value = "";

          setTimeout(function () {
            const user = mediConnect.getUser();

            if (user) {
              redirectBasedOnRole(user.rol);
            } else {
              switchTab("login");
            }
          }, 1500);

          return;
        }

        showToast((result && result.message) || "Error al crear cuenta", "error");
      } catch (error) {
        console.error(error);
        showToast("Error al registrarse", "error");
      } finally {
        setLoading("registerBtn", false);
      }
    }
  </script>
</body>

</html>
