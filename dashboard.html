<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediConnect – Inicio</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="page">
    <!-- Header -->
    <div class="app-header fade-up">
      <div class="header-greeting" style="flex: 1">
        <h2 id="greeting">Hola, ...</h2>
        <div id="roleBadgeContainer"></div>
      </div>
      <div class="avatar" id="avatarEl" onclick="location.href='perfil.html'" style="position: relative;">
  <span id="avatarLetter">?</span>
  <span id="notifDot" style="
    position: absolute;
    top: -2px;
    right: -2px;
    width: 12px;
    height: 12px;
    background: #EF4444;
    border: 2px solid white;
    border-radius: 50%;
    display: none;
  "></span>
</div>
    </div>

    <div class="dash-content">
      <!-- Stats -->
      <div class="stats-container fade-up delay-1" id="statsContainer">
        <!-- Dinámico -->
      </div>

      <!-- Actividad Reciente -->
      <div class="fade-up delay-2">
        <div class="section-header">
          <h2 id="listTitle">Actividad Reciente</h2>
          <a href="buscar.html">Ver todo</a>
        </div>
        <div class="activity-list" id="activityList" style="display: flex; flex-direction: column; gap: 12px">
          <!-- Skeleton -->
          <div class="med-card">
            <div class="med-img skeleton"></div>
            <div class="med-info">
              <div class="skeleton" style="height: 14px; width: 70%; margin-bottom: 6px"></div>
              <div class="skeleton" style="height: 11px; width: 45%"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Historial -->
      <div class="section fade-up delay-3" id="historialSection" style="display: none">
        <div class="section-header">
          <h2 class="section-title">Historial Reciente</h2>
        </div>
        <div id="historialList" style="display: flex; flex-direction: column; gap: 12px">
          <!-- Se llena dinámicamente -->
        </div>
      </div>

      <!-- Invite Banner -->
      <div class="invite-banner fade-up delay-3" style="
            background: var(--white);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            border: 1px solid var(--gray-100);
            box-shadow: var(--shadow-sm);
          ">
        <h3 style="font-size: 16px; margin-bottom: 4px">
          ¡Invita a un amigo!
        </h3>
        <p style="font-size: 13px; color: var(--gray-400); margin-bottom: 16px">
          Ayuda a crecer nuestra red de donantes.
        </p>
        <button class="btn-primary" onclick="shareApp()" style="padding: 10px 20px; font-size: 14px">
          Compartir App
        </button>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item active">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
      </svg>
      Inicio
    </a>
    <a href="buscar.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 15.803a7.5 7.5 0 0010.607 0z" />
      </svg>
      Buscar
    </a>
    <button class="nav-btn-center" id="addDonationBtn" onclick="location.href='donar.html'" style="display: none;">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
    </button>
    <a href="perfil.html" class="nav-item" style="position: relative;">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
      </svg>
      Perfil
      <span id="navNotifDot" style="
    position: absolute;
    top: 2px;
    right: 6px;
    width: 8px;
    height: 8px;
    background: #EF4444;
    border-radius: 50%;
    display: none;
  "></span>
    </a>
  </nav>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    // Inicializar Supabase Client (SUPABASE_URL y SUPABASE_KEY ya existen en app.js)
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    //console.log("✅ Dashboard: supabaseClient listo");

    const MEDICINE_EMOJIS = {
      Antibiótico: "💊",
      Antiinflamatorio: "🩹",
      Antidiabético: "💉",
      Analgésico: "🔴",
      default: "💊",
    };
    const STATUS_MAP = {
      disponible: "badge-success",
      reservado: "badge-warning",
      entregado: "badge-blue",
      pendiente: "badge-warning",
      rechazado: "badge-danger",
    };

    function showToast(msg, type = "") {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = "toast " + type;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2800);
    }

    function shareApp() {
      if (navigator.share) {
        navigator.share({
          title: "MediConnect",
          text: "¡Únete a MediConnect y ayuda a conectar donaciones de medicamentos!",
          url: window.location.origin,
        });
      } else {
        navigator.clipboard
          .writeText(window.location.origin)
          .then(() => showToast("Enlace copiado", "success"));
      }
    }

    // ===== FUNCIÓN PRINCIPAL: Verificar sesión al cargar =====
    async function initDashboard() {
      //console.log("🔍 Verificando sesión...");

      // 1. PRIMERO: Verificar sesión de Google (Supabase Auth)
      const {
        data: { session },
      } = await supabaseClient.auth.getSession();

      if (session?.user) {
        //console.log("✅ Sesión de Google detectada:", session.user.email);

        const userEmail = session.user.email;
        const userName =
          session.user.user_metadata?.full_name || userEmail.split("@")[0];

        // Buscar si el usuario ya existe en la tabla 'usuarios'
        const query = `email=eq.${encodeURIComponent(userEmail)}`;
        const existingUsers = await sb.select("usuarios", query);

        if (existingUsers && existingUsers.length > 0) {
          // Usuario existente - guardar en localStorage
          mediConnect.saveUser(existingUsers[0]);
         // console.log("👤 Usuario existente cargado:",existingUsers[0].nombre,);
        } else {
          // Primera vez con Google - crear usuario automáticamente
          //console.log("🆕 Creando nuevo usuario desde Google...");
          const newUser = {
            nombre: userName,
            email: userEmail,
            password: "google_" + Math.random().toString(36).substring(2),
            rol: "receptor",
          };

          const createdUser = await sb.insert("usuarios", newUser);
          if (createdUser) {
            mediConnect.saveUser(createdUser);
            //console.log("✅ Nuevo usuario creado:", createdUser.nombre);
          } else {
            console.error("❌ No se pudo crear el usuario");
            showToast("Error al crear usuario", "error");
            return;
          }
        }

        // Cargar dashboard
        loadDashboard(session);
        return;
      }

      // 2. SEGUNDO: Verificar sesión local (email/password)
      const user = mediConnect.getUser();

      if (user) {
       // console.log("✅ Sesión local detectada:", user.nombre);
        loadDashboard();
        return;
      }


      // 3. No hay sesión - redirigir al login
      console.log("❌ No hay sesión, redirigiendo al login...");
      window.location.href = "index.html";
    }

    // ===== Cargar dashboard (tu código original mejorado) =====

    async function loadDashboard() {
      document.getElementById('roleBadgeContainer').innerHTML = '';
      document.getElementById('greeting').textContent = 'Cargando...';
      const user = mediConnect.getUser();

      if (!user) {
        window.location.href = "index.html";
        return;
      }

      // Obtener sesión de Google
      const {
        data: { session },
      } = await supabaseClient.auth.getSession();

      const role = user.rol || "receptor";
      const roleUpper = role.charAt(0).toUpperCase() + role.slice(1);

      document.getElementById("greeting").textContent =
        "Hola, " + user.nombre.split(" ")[0];

      // Avatar: mostrar foto o letra
      const avatarBD = user.avatar_url;
      const avatarGoogle = session?.user?.user_metadata?.avatar_url;

     if (avatarBD || avatarGoogle) {
  // Ocultar la letra
  document.getElementById("avatarLetter").style.display = "none";
  
  // Crear imagen sin borrar el puntito
  const img = document.createElement("img");
  img.src = avatarBD || avatarGoogle;
  img.style.cssText = "width:100%;height:100%;border-radius:12px;object-fit:cover;position:absolute;top:0;left:0;";
  img.id = "avatarImg";
  
  // Eliminar imagen anterior si existe
  const oldImg = document.getElementById("avatarImg");
  if (oldImg) oldImg.remove();
  
  // Insertar imagen al inicio del avatarEl
  const avatarEl = document.getElementById("avatarEl");
  avatarEl.insertBefore(img, avatarEl.firstChild);
}
     else {
        document.getElementById("avatarLetter").textContent = user.nombre
          .charAt(0)
          .toUpperCase();
      }

      document.getElementById("roleBadgeContainer").innerHTML = `
      <span class="role-badge ${role.toLowerCase()}">
     <svg width="12" height="12" fill="currentColor" viewBox="0 0 20 20"><path d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"/></svg>
     ${roleUpper}
     </span>
    `;

      // Ocultar botón "+" si no es donante
      const btnAdd = document.getElementById("addDonationBtn");
      if (btnAdd) {
        btnAdd.style.display = role === "donante" ? "flex" : "none";
      }

      // Stats Dinámicos
      const statsContainer = document.getElementById("statsContainer");
      let statsHTML = "";
      if (role === "donante") {
        statsHTML = `
        <div class="stat-card">
          <div class="icon-wrap" style="background:#ECFDF5;color:#10B981"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg></div>
          <h4 id="stat1">0</h4><p>Mis Donaciones</p>
        </div>
        <div class="stat-card">
          <div class="icon-wrap" style="background:#EFF6FF;color:#3B82F6"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
          <h4 id="stat2">0</h4><p>Entregados</p>
        </div>
      `;
      } else if (role === "validador") {
        statsHTML = `
        <div class="stat-card">
          <div class="icon-wrap" style="background:#FFFBEB;color:#F59E0B"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg></div>
          <h4 id="stat1">0</h4><p>Por Validar</p>
        </div>
        <div class="stat-card">
          <div class="icon-wrap" style="background:#F3F4F6;color:#4B5563"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg></div>
          <h4 id="stat2">0</h4><p>Revisados</p>
        </div>
      `;
      } else {
        statsHTML = `
        <div class="stat-card">
          <div class="icon-wrap" style="background:#F5F3FF;color:#8B5CF6"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg></div>
          <h4 id="stat1">0</h4><p>Mis Reservas</p>
        </div>
      `;
      }
      statsContainer.innerHTML = statsHTML;

      const list = document.getElementById("activityList");
      const histList = document.getElementById("historialList");
      const histSection = document.getElementById("historialSection");
      let allMeds = [];

      if (role === "donante") {
        document.getElementById("listTitle").textContent =
          "Mis Donaciones Activas";
        allMeds = await mediConnect.getDonations({ donante_id: user.id });
      } else if (role === "validador") {
        document.getElementById("listTitle").textContent =
          "Acciones Pendientes";
        allMeds = await mediConnect.getDonations();
      } else {
        document.getElementById("listTitle").textContent =
          "Mis Reservas Activas";
        allMeds = await mediConnect.getDonations({ receptor_id: user.id });
      }

      // Filtrar Activos vs Historial
      let activeMeds = [];
      let historyMeds = [];

      if (role === "donante" || role === "receptor") {
        activeMeds = allMeds.filter(
          (d) => d.estado !== "entregado" && d.estado !== "rechazado",
        );
        historyMeds = allMeds.filter(
          (d) => d.estado === "entregado" || d.estado === "rechazado",
        );
      } else if (role === "validador") {
        activeMeds = allMeds.filter(
          (d) => d.estado === "reservado" || d.estado === "aprobado",
        );
        historyMeds = allMeds.filter(
          (d) => d.estado === "entregado" || d.estado === "rechazado",
        );
      }



      // Renderizar Activos
      if (activeMeds.length === 0) {
        list.innerHTML =
          '<p style="color:var(--gray-400);text-align:center;padding:40px 0;font-size:14px;font-weight:600;">No hay acciones pendientes</p>';
      } else {
        list.innerHTML = activeMeds
          .map((d) => renderMedCard(d, role))
          .join("");
      }

      // Renderizar Historial
      if (historyMeds.length > 0) {
        histSection.style.display = "block";
        histList.innerHTML = historyMeds
          .map((d) => renderMedCard(d, role, true))
          .join("");
      } else {
        histSection.style.display = "none";
      }

      // Stats
      if (document.getElementById("stat1")) {
        document.getElementById("stat1").textContent = activeMeds.length;
      }
      if (document.getElementById("stat2")) {
        document.getElementById("stat2").textContent = historyMeds.length;
      }
      document.querySelector('.page').classList.add('loaded');
    
      checkNotificacionesPendientes();
    }

    function renderMedCard(d, role, isHistory = false) {
      const statusMap = {
        disponible: "badge-success",
        reservado: "badge-warning",
        aprobado: "badge-blue",
        entregado: "badge-success",
        rechazado: "badge-danger",
      };

      let actionsHTML = "";
      if (!isHistory) {
        if (role === "donante" && d.estado === "disponible") {
          actionsHTML = `
          <div style="display:flex; gap:4px; margin-top:4px;">
            <button onclick="event.stopPropagation(); location.href='donar.html?edit=${d.id}'" style="background:var(--primary); border:none; color:white; padding:4px 8px; border-radius:6px; font-size:10px; font-weight:800; cursor:pointer;">Editar</button>
            <button onclick="event.stopPropagation(); deleteMed('${d.id}')" style="background:var(--danger); border:none; color:white; padding:4px 8px; border-radius:6px; font-size:10px; font-weight:800; cursor:pointer;">Eliminar</button>
          </div>
        `;
        } else if (role === "validador") {
          if (d.estado === "reservado") {
            actionsHTML = `
            <div style="display:flex; gap:4px; margin-top:4px;">
              <button onclick="event.stopPropagation(); updateMedStatus('${d.id}', 'aprobado')" style="background:var(--success); border:none; color:white; padding:4px 8px; border-radius:6px; font-size:10px; font-weight:800; cursor:pointer;">Aprobar</button>
              <button onclick="event.stopPropagation(); updateMedStatus('${d.id}', 'rechazado')" style="background:var(--danger); border:none; color:white; padding:4px 8px; border-radius:6px; font-size:10px; font-weight:800; cursor:pointer;">Rechazar</button>
            </div>
          `;
          } else if (d.estado === "aprobado") {
            actionsHTML = `
            <div style="display:flex; gap:4px; margin-top:4px;">
              <button onclick="event.stopPropagation(); updateMedStatus('${d.id}', 'entregado')" style="background:var(--primary); border:none; color:white; padding:4px 8px; border-radius:6px; font-size:10px; font-weight:800; cursor:pointer;">Marcar Entregado</button>
            </div>
          `;
          }
        }
      }

      return `
      <div class="med-card ${isHistory ? "history-card" : ""}" style="${isHistory ? "opacity:0.7; filter:grayscale(0.5);" : ""}" onclick="location.href='buscar.html'">
        <div class="med-img">
          ${d.imagen_url
          ? `<img src="${d.imagen_url}" alt="${d.nombre}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`
          : MEDICINE_EMOJIS[d.tipo] || MEDICINE_EMOJIS.default
        }
        </div>
        <div class="med-info">
          <h3>${d.nombre}</h3>
          <p>${d.tipo} · ${d.cantidad} un.</p>
          <div class="med-meta">
            Vence: ${d.fecha_vencimiento}
          </div>
        </div>
        <div class="med-badge-wrap" style="display:flex; flex-direction:column; gap:4px; align-items:flex-end;">
          <span class="badge ${statusMap[d.estado] || "badge-blue"}">${d.estado}</span>
          ${actionsHTML}
        </div>
      </div>
    `;
    }

    async function updateMedStatus(id, newStatus) {
      try {
        const ok = await mediConnect.updateDonationStatus(id, newStatus);
        if (ok) {
          let msg = "Estado actualizado";
          if (newStatus === "aprobado") msg = "Medicamento aprobado ✓";
          if (newStatus === "rechazado") msg = "Medicamento rechazado ✗";
          if (newStatus === "entregado") msg = "Entrega confirmada ✓";
          showToast(msg, "success");
          loadDashboard();
        } else {
          showToast("Error al actualizar", "error");
        }
      } catch (e) {
        console.error(e);
        showToast("Error de conexión", "error");
      }
    }

    async function deleteMed(id) {
      if (!confirm("¿Estás seguro de que deseas eliminar esta donación?"))
        return;
      try {
        const ok = await mediConnect.deleteDonation(id);
        if (ok) {
          showToast("Donación eliminada", "success");
          loadDashboard();
        } else {
          showToast("No se pudo eliminar", "error");
        }
      } catch (e) {
        showToast("Error de conexión", "error");
      }
    }

    // Cerrar sesión (actualizado para Google)
    async function cerrarSesion() {
      try {
        await supabaseClient.auth.signOut();
        console.log("🔒 Sesión de Google cerrada");
      } catch (e) {
        console.log("No había sesión de Google");
      }
      mediConnect.logout();
      window.location.href = "index.html";
    }

    // ===== INICIAR DASHBOARD =====
    initDashboard();

async function checkNotificacionesPendientes() {
  try {
    const user = mediConnect.getUser();
    if (!user) return;
    
    const query = `or=(usuario_id.eq.${user.id},usuario_id.is.null)&leida=eq.false&limit=1`;
    const pendientes = await sb.select('notificaciones', query);
    const hayPendientes = pendientes && pendientes.length > 0;
    
    // Punto en avatar del dashboard
    const dotAvatar = document.getElementById('notifDot');
    if (dotAvatar) dotAvatar.style.display = hayPendientes ? 'block' : 'none';
    
    // Punto en nav de Perfil
    const navDot = document.getElementById('navNotifDot');
    if (navDot) navDot.style.display = hayPendientes ? 'block' : 'none';
    
  } catch(e) {}
}
  </script>

</body>

</html>
