<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediConnect – Editar Perfil</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="page">
    <!-- Header -->
    <div class="app-header fade-up">
      <button class="back-btn" onclick="location.href='perfil.html'">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
        </svg>
      </button>
      <h1>Editar Perfil</h1>
    </div>

    <div class="view-content" style="padding-top: 20px;">
      <div class="profile-hero fade-up" style="background: none; padding: 20px 0; height: auto; box-shadow: none;">
        <div class="avatar-lg" id="avatarLg">?</div>
        <p style="margin-top: 10px; color: var(--gray-400); font-size: 13px;">Toca la foto para cambiarla</p>
      </div>

      <form id="editProfileForm" onsubmit="handleSave(event)" class="fade-up delay-1"
        style="display: flex; flex-direction: column; gap: 20px;">
        <div class="input-group">
          <label>Nombre Completo</label>
          <div class="input-wrap">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            <input type="text" id="nombreInput" class="input-field" placeholder="Tu nombre">
          </div>
        </div>

        <div class="input-group">
          <label>Correo Electrónico</label>
          <div class="input-wrap">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
            <input type="email" id="emailInput" class="input-field" disabled
              style="background: var(--gray-50); cursor: not-allowed;">
          </div>
        </div>

        <button type="submit" class="btn-primary" id="saveBtn" style="margin-top: 10px;">Guardar Cambios</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
  <script>
    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast ' + type; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    const user = mediConnect.getUser();
    if (!user) { location.href = 'index.html'; }

    document.getElementById('nombreInput').value = user.nombre;
    document.getElementById('emailInput').value = user.email;
    document.getElementById('avatarLg').textContent = user.nombre.charAt(0).toUpperCase();

    async function handleSave(e) {
      e.preventDefault();
      const newName = document.getElementById('nombreInput').value.trim();
      if (!newName) return showToast('El nombre es requerido', 'error');

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      try {
        const ok = await mediConnect.updateUsuario(user.id, { nombre: newName });
        if (ok) {
          user.nombre = newName;
          mediConnect.saveUser(user);
          showToast('Perfil actualizado ✓', 'success');
          setTimeout(() => location.href = 'perfil.html', 1500);
        } else {
          showToast('Error al actualizar', 'error');
        }
      } catch (err) {
        showToast('Error de conexión', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Guardar Cambios';
      }
    }
  </script>
</body>

</html>
